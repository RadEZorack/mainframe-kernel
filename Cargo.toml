[package]
name = "mainframe-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9"

[lib]
name = "mainframe_kernel"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mainframe-kernel"
path = "src/bin/kernel.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
